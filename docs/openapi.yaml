openapi: 3.1.0
info:
  title: Belegcheck API
  version: "1.0"
  summary: Prüft Spesenbelege auf Echtheit und Plausibilität – Score, Abdeckung, Befunde und gelesene Daten.
  description: |
    Ein Beleg (Foto oder PDF) wird angeliefert und in mehreren Schichten geprüft:
    Kassen-QR-Code (RKSV Österreich, DSFinV-K Deutschland) gegen den gedruckten Inhalt, Kassen-Gedächtnis,
    Dubletten über alle Einreichungen, Orte und Zeiten derselben Person, Bild-Metadaten,
    Aussteller-Screening (UID im EU-Register VIES, Lokal und Öffnungszeiten in OpenStreetMap),
    Branche und Compliance-Kategorien laut Richtlinie des Unternehmens.

    **Grundsatz:** Die Schnittstelle weist auf Auffälligkeiten hin, sie entscheidet nicht. Es gibt die Empfehlungen
    `automatisch_freigeben`, `stichprobe` und `manuell_pruefen` – bewusst kein „ablehnen“.
    Ein Score von 100 bedeutet „keine Auffälligkeit gefunden“, nicht „echt“. Wie viel überhaupt prüfbar war,
    sagt die `abdeckung`.

    **Datenschutz:** Belegdateien werden nach der Prüfung verworfen (asynchron: bis dahin verschlüsselt abgelegt).
    Gespeichert bleiben das Ergebnis und Fingerabdrücke (Hashes) für die Dublettenerkennung, bis sie mit
    `DELETE /pruefungen/{id}` gelöscht werden. Nach außen gehen nur Daten des Ausstellers (UID, Name, Ort).

    **Fehler** kommen als `application/problem+json` (RFC 9457).
  contact:
    name: DIGITALFEX GmbH
    email: web@digitalfex.com
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: belegcheck.example
security:
  - apiSchluessel: []
tags:
  - name: Prüfungen
  - name: Betrieb
paths:
  /pruefungen:
    post:
      tags: [Prüfungen]
      operationId: pruefungAnlegen
      summary: Beleg prüfen
      description: |
        Standard ist synchron (Antwort `200` mit Ergebnis, typisch 10–30 Sekunden).
        Mit `Prefer: respond-async` antwortet die Schnittstelle sofort mit `202` und `Location`; das Ergebnis kommt
        per Webhook oder über `GET /pruefungen/{id}`.
      parameters:
        - name: Prefer
          in: header
          required: false
          schema: { type: string, example: respond-async }
        - name: Idempotency-Key
          in: header
          required: false
          description: Eindeutiger Schlüssel je Spesenposition. Wiederholtes Senden liefert dieselbe Prüfung (Kopfzeile `Idempotent-Replayed`).
          schema: { type: string, maxLength: 191 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  required: [datei]
                  properties:
                    datei:
                      type: string
                      format: binary
                      description: JPG, PNG, HEIC, WEBP oder PDF, höchstens 25 MB
                - $ref: '#/components/schemas/Angaben'
          application/json:
            schema:
              allOf:
                - type: object
                  required: [datei_base64, dateiname]
                  properties:
                    datei_base64: { type: string, contentEncoding: base64 }
                    dateiname: { type: string, example: beleg.pdf }
                - $ref: '#/components/schemas/Angaben'
      responses:
        '200':
          description: Prüfung fertig (synchron) oder Wiederholung mit gleichem Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pruefung' }
        '202':
          description: Angenommen, Prüfung läuft im Hintergrund
          headers:
            Location: { schema: { type: string, format: uri } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pruefung' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503':
          description: Prüfung derzeit nicht möglich – später erneut senden (gleicher Idempotency-Key)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Prüfungen]
      operationId: pruefungenListen
      summary: Prüfungen auflisten (neueste zuerst, Cursor-Seiten)
      parameters:
        - { name: externe_referenz, in: query, schema: { type: string } }
        - { name: einreicher, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Status' } }
        - { name: empfehlung, in: query, schema: { $ref: '#/components/schemas/Empfehlung' } }
        - { name: seit, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  objekt: { const: liste }
                  daten: { type: array, items: { $ref: '#/components/schemas/Pruefung' } }
                  naechster_cursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
  /pruefungen/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Prüfungen]
      operationId: pruefungAbrufen
      summary: Prüfung abrufen
      responses:
        '200':
          description: Prüfung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pruefung' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Prüfungen]
      operationId: pruefungLoeschen
      summary: Prüfung samt Fingerabdrücken löschen
      responses:
        '204': { description: Gelöscht }
        '404': { $ref: '#/components/responses/Problem' }
  /pruefungen/{id}/entscheidung:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Prüfungen]
      operationId: entscheidungMelden
      summary: Entscheidung der Prüferin/des Prüfers zurückmelden
      description: '„in_ordnung“ übernimmt die Kasse ins Kassen-Gedächtnis – künftige Belege dieser Kasse werden besser beurteilt.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ergebnis]
              properties:
                ergebnis: { type: string, enum: [in_ordnung, beanstandet] }
                kommentar: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pruefung' }
        '409': { $ref: '#/components/responses/Problem' }
  /gesund:
    get:
      tags: [Betrieb]
      operationId: gesund
      security: []
      summary: Erreichbarkeit und Version des Regelwerks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  regelwerk: { type: string }
webhooks:
  pruefungFertig:
    post:
      summary: Prüfung fertig oder fehlgeschlagen
      description: |
        POST an die beim Mandanten hinterlegte URL. Kopfzeile `Belegcheck-Signatur: t=<Unix-Zeit>,v1=<Hex>`,
        wobei v1 = HMAC-SHA256(Webhook-Geheimnis, "<t>.<Rohtext des Körpers>"). Signatur prüfen und Nachrichten
        älter als 5 Minuten verwerfen. Erwartet wird eine 2xx-Antwort; sonst Wiederholung nach 1, 5, 15, 60 Minuten und 6 Stunden.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: Ereignis-ID (zum Erkennen von Wiederholungen) }
                typ: { type: string, enum: [pruefung.fertig, pruefung.fehlgeschlagen] }
                erstellt_am: { type: string, format: date-time }
                daten: { $ref: '#/components/schemas/Pruefung' }
      responses:
        '2XX': { description: Empfangen }
components:
  securitySchemes:
    apiSchluessel:
      type: http
      scheme: bearer
      description: 'API-Schlüssel im Format bc_<präfix>_<geheimnis>, je Mandant (Server: php artisan beleg:api-schluessel <kürzel>).'
  responses:
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Angaben:
      type: object
      description: Optionale Angaben aus der Spesenabrechnung – werden mit dem Beleg abgeglichen
      properties:
        externe_referenz: { type: string, maxLength: 191, description: 'Kennung der Spesenposition im ERP; erneute Übertragung derselben Position gilt nicht als Doppeleinreichung' }
        einreicher: { type: string, maxLength: 191, description: 'Pseudonyme Kennung der Person (z. B. Personalnummer) – für Dubletten und Orts-/Zeitcheck' }
        betrag: { type: string, pattern: '^-?\d{1,7}([.,]\d{1,2})?$', example: '46,00', description: Eingereichter Betrag in EUR }
        datum: { type: string, format: date, description: Eingereichtes Belegdatum }
        kategorie: { type: string, enum: [bewirtung, verpflegung, uebernachtung, tanken, parken, fahrt, kfz, porto] }
    Status:
      type: string
      enum: [wartend, laeuft, fertig, fehler]
    Empfehlung:
      type: string
      enum: [automatisch_freigeben, stichprobe, manuell_pruefen]
      description: |
        manuell_pruefen: Score unter der Freigabeschwelle (Standard 86) oder ein Widerspruch.
        automatisch_freigeben: Score ab Schwelle und Abdeckung ab Mindestwert (Standard 0,6).
        stichprobe: unauffällig, aber wenig prüfbar (z. B. Beleg ohne Kassen-QR-Code).
    Befund:
      type: object
      properties:
        code: { type: string, example: AT-QR-04 }
        titel: { type: string }
        stufe: { type: string, enum: [nicht_pruefbar, hinweis, auffaellig, widerspruch] }
        punkte: { type: integer, description: 'Beitrag zum Risikowert (Hinweis 5, auffällig 15, Widerspruch 50; Hinweise zusammen höchstens 30)' }
        begruendung: { type: string }
        werte: { type: object, additionalProperties: true }
    Pruefung:
      type: object
      properties:
        id: { type: string, description: ULID }
        objekt: { const: pruefung }
        status: { $ref: '#/components/schemas/Status' }
        erstellt_am: { type: string, format: date-time }
        fertig_am: { type: [string, 'null'], format: date-time }
        externe_referenz: { type: [string, 'null'] }
        einreicher: { type: [string, 'null'] }
        angaben: { type: [object, 'null'] }
        ergebnis:
          type: [object, 'null']
          properties:
            score: { type: integer, minimum: 0, maximum: 100, description: '100 − Risikowert; grün ab 86, rot bis 50' }
            abdeckung: { type: number, minimum: 0, maximum: 1, description: 'Anteil der prüfbaren Bereiche (Kassen-QR 45 %, Druckabgleich 15 %, Aussteller 20 %, Dubletten 10 %, Bild 10 %)' }
            ampel: { type: string, enum: [gruen, gelb, rot] }
            empfehlung: { $ref: '#/components/schemas/Empfehlung' }
            risikowert: { type: integer }
            bereiche: { type: object, additionalProperties: { type: number } }
            befunde: { type: array, items: { $ref: '#/components/schemas/Befund' }, description: Alle Prüfungen außer den bestandenen }
            pruefungen: { type: integer, description: Anzahl ausgeführter Prüfregeln }
            daten:
              type: object
              properties:
                aussteller: { type: [string, 'null'] }
                uid: { type: [string, 'null'] }
                uid_gueltig: { type: [boolean, 'null'] }
                firmenname_register: { type: [string, 'null'] }
                land: { type: [string, 'null'], enum: [AT, DE, null] }
                ort: { type: [object, 'null'], properties: { plz: { type: string }, ort: { type: string } } }
                datum: { type: [string, 'null'], description: 'Belegzeitpunkt (Ortszeit), z. B. 2025-06-13T09:30:59' }
                summe_cent: { type: [integer, 'null'] }
                waehrung: { type: string, const: EUR }
                steuersaetze_cent: { type: [object, 'null'], additionalProperties: { type: integer }, description: 'Brutto je Steuersatz, Schlüssel = Prozentsatz, z. B. {"10": 3170, "20": 1040}' }
                kasse: { type: [string, 'null'] }
                belegnummer: { type: [string, 'null'] }
                kassen_qr: { type: [string, 'null'], enum: [rksv, dsfinvk, null] }
                branche: { type: [string, 'null'] }
                compliance: { type: array, items: { type: object, properties: { regel: { type: string }, kategorie: { type: string }, richtlinie: { type: string } } } }
                lokal: { type: [object, 'null'] }
                quellen:
                  type: object
                  description: 'Woher ein Wert stammt: kassen_qr (signiert), texterkennung, pdf_text, sprachmodell'
                  additionalProperties: { type: [string, 'null'] }
        fehler: { type: [string, 'null'] }
        entscheidung: { type: [object, 'null'] }
        regelwerk: { type: string, description: Version der Prüfregeln }
        links: { type: object, properties: { self: { type: string, format: uri } } }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        fehler: { type: object, additionalProperties: { type: array, items: { type: string } }, description: Feldfehler bei 422 }
        pruefung: { type: string, description: ID der fehlgeschlagenen Prüfung (bei 503) }
